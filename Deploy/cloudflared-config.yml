# Cloudflare Tunnel config (ASCII only: Windows PowerShell 5.1 mangles UTF-8 without BOM).
# install_tunnel.ps1 replaces <TUNNEL_ID> / <CREDENTIALS_FILE> and copies this to %USERPROFILE%/.cloudflared/config.yml
# Only Node.js :3001 is exposed. FastAPI :8000, LSTM :8001 and PostgreSQL :5432 are NOT in ingress.
tunnel: <TUNNEL_ID>
credentials-file: <CREDENTIALS_FILE>

ingress:
  - hostname: api.erucmoney.com
    service: http://localhost:3001
    originRequest:
      connectTimeout: 30s
  - service: http_status:404
