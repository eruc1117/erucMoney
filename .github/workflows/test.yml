# 自動測試（測試計畫第 2 期：股票 API）
#
# 觸發：push 到 master／main 或 PR，且 Server/ 或本檔有變動。
# Node job：起 Postgres 16 → 建 Stock_test → cd Server && npm ci && npm test（單元 + http + migration）。
# Server/.env.test 固定 DB_HOST=localhost、DB_USER=postgres、DB_NAME=Stock_test；密碼由下面的 env 給。
name: Tests

on:
  push:
    branches: [master, main]
    paths: ['Server/**', 'Crawler/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['Server/**', 'Crawler/**', '.github/workflows/test.yml']
  workflow_dispatch:

jobs:
  server:
    name: 股票 API（Server/）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_PASSWORD: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - name: 建立測試資料庫
        run: psql -h localhost -U postgres -c 'CREATE DATABASE "Stock_test";'
      - run: npm ci
        working-directory: Server
      - run: npm test -- --coverage
        working-directory: Server

  # ── 第 3 期：爬蟲與資料管線（Crawler/，pytest）──
  # 不上網（responses 攔 requests、FinMind 用假 DataLoader）；db 標記的測試用 Stock_crawler_test（名字必須以 _test 結尾）。
  crawler:
    name: 爬蟲與資料管線（Crawler/）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      CRAWLER_TEST_DB: Stock_crawler_test
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            Crawler/requirements.txt
            Crawler/requirements-test.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
        working-directory: Crawler
      - run: python -m pytest -q
        working-directory: Crawler
