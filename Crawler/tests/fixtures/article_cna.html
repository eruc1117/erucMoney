<p>台積電今日召開法說會，釋出第四季展望優於預期，外資隨即調高目標價至三千元，並維持買進評等不變，市場預期明年上半年營收將持續成長，毛利率可望維持在高檔。</p>
<p>法人指出，先進製程需求持續強勁，二奈米量產時程如期，明年資本支出將再創新高，帶動設備與材料供應鏈同步受惠；高效能運算與人工智慧相關訂單能見度已看到明年下半年。</p>
<p>短</p>
